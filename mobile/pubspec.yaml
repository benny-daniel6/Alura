name: aura_wardrobe
description: "Alura - The Intelligent Digital Wardrobe & AI Stylist"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  google_fonts: ^6.2.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.1.0
  intl: ^0.19.0
  uuid: ^4.3.3
  image: ^4.2.0
  image_picker: ^1.1.2
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
